<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191919">
  <meta name="referrer" content="no-referrer">
  <title>Roadmap - Notes</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/roadmap.css">
  <script src="/roadmap.js" type="module"></script>
</head>
<body class="roadmap-page">
  <main class="roadmap">
    <a class="roadmap-back" href="/">‹ Notes</a>
    <div class="roadmap-head">
      <h1>Roadmap</h1>
      <p id="roadmap-total" class="roadmap-total">Loading…</p>
    </header>
    <div class="roadmap-bar" role="progressbar" aria-label="Problems solved" aria-valuemin="0" aria-valuemax="150" aria-valuenow="0"><i id="roadmap-bar-fill"></i></div>
    <p id="roadmap-languages" class="roadmap-languages"></p>

    <form id="roadmap-form" class="roadmap-form">
      <label class="roadmap-sr" for="roadmap-text">Problems you solved</label>
      <textarea id="roadmap-text" rows="3" placeholder="Type what you solved, one per line&#10;two sum python&#10;3sum - c++" spellcheck="false" autocomplete="off"></textarea>
      <div class="roadmap-form-row">
        <label class="roadmap-default">Default language
          <select id="roadmap-default"><option value="">None</option></select>
        </label>
        <button id="roadmap-add" class="roadmap-primary" type="submit">Add</button>
      </div>
      <div id="roadmap-unmatched" class="roadmap-unmatched" hidden></div>
      <p id="roadmap-status" class="roadmap-status" role="status" aria-live="polite"></p>
    </form>

    <div id="roadmap-categories" class="roadmap-categories"></div>
  </main>
</body>
</html>
