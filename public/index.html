<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191919">
  <title>Notes</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/favicon-16-dark.png" type="image/png" sizes="16x16" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon-32-dark.png" type="image/png" sizes="32x32" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="mask-icon" href="/mask-icon.svg" color="#202020">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
  <script src="/pdf-view.js" defer></script>
  <script src="/books.js" defer></script>
</head>
<body>
  <aside>
    <header><span class="brand"><span class="gem">◇</span> Notes</span><span class="head-actions"><button id="trash" title="Trash">Trash</button><button id="logout" title="Sign out">Sign out</button><button id="new" title="New note" aria-label="New note">+</button></span></header>
    <a id="books-open" class="books-link" href="#/books" title="Open your books">Books</a>
    <nav id="notes" aria-label="Notes"></nav>
    <section class="timer" aria-label="Time tracker">
      <input id="task" type="text" placeholder="What are you working on?" maxlength="200" autocomplete="off" aria-label="Task description">
      <div class="timer-row"><span id="clock" aria-live="off">0:00:00</span><button id="toggle-timer" class="tool">Start</button></div>
      <button id="report" class="timer-summary" title="Open the time report"><span>Today <b id="sum-today">0:00</b></span><span>Week <b id="sum-week">0:00</b></span><span>Month <b id="sum-month">0:00</b></span></button>
    </section>
    <footer><span class="dot"></span><span class="foot-text">Public notebook</span><div class="size-picker"><button id="size" type="button" aria-label="Text size: 14 pixels" aria-expanded="false" aria-controls="size-options">14 px ▾</button><div id="size-options" role="group" aria-label="Text size" hidden><button type="button" data-size="8">8 px</button><button type="button" data-size="10">10 px</button><button type="button" data-size="12">12 px</button><button type="button" data-size="14">14 px</button><button type="button" data-size="16">16 px</button><button type="button" data-size="18">18 px</button><button type="button" data-size="20">20 px</button><button type="button" data-size="24">24 px</button></div></div></footer>
  </aside>
  <main data-page="notes">
    <section id="report-view" class="report" hidden aria-label="Time report">
      <div class="report-head"><h2>Time report</h2><button id="close-report" class="tool">Back to notes</button></div>
      <div class="totals">
        <div class="total"><span class="total-label">Today</span><b id="report-today">0:00</b></div>
        <div class="total"><span class="total-label">This week</span><b id="report-week">0:00</b></div>
        <div class="total"><span class="total-label">This month</span><b id="report-month">0:00</b></div>
      </div>
      <div id="week-chart" class="week-chart" role="img" aria-label="Hours per day this week"></div>
      <div id="entries" class="entries"></div>
    </section>
    <section id="books-view" class="books" aria-label="Books">
      <div id="library" class="library">
        <div class="books-head"><h2>Books</h2><span id="books-note" role="status"></span><button id="books-upload" class="tool">Upload book</button><button id="books-close" class="tool">Back to notes</button></div>
        <div id="books-list" class="books-list"></div>
      </div>
      <div id="reader" class="reader" hidden>
        <div class="reader-bar">
          <a id="reader-back" class="tool" href="#/books">‹ Library</a>
          <span id="reader-title" class="reader-title"></span>
          <select id="reader-toc" class="tool" aria-label="Contents"></select>
          <button id="reader-smaller" class="tool" title="Smaller text, or zoom out" aria-label="Smaller">A−</button>
          <button id="reader-larger" class="tool" title="Larger text, or zoom in" aria-label="Larger">A+</button>
          <button id="reader-theme" class="tool" title="Switch between dark and light">Dark</button>
          <label class="tool pdf-only">Page <input id="reader-page" type="number" min="1" step="1" aria-label="Page number"><span id="reader-pages"></span></label>
          <button id="reader-prev" class="tool" aria-label="Previous page">‹</button>
          <span id="reader-progress" class="reader-progress"></span>
          <button id="reader-next" class="tool" aria-label="Next page">›</button>
          <button id="reader-sidebar" class="tool" title="Hide or show the sidebar while you read">Hide sidebar</button>
        </div>
        <div id="reader-stage" class="reader-stage"></div>
      </div>
      <input id="book-file" type="file" accept=".pdf,.epub,application/pdf,application/epub+zip" hidden>
    </section>
    <div class="toolbar"><span id="status" role="status">Loading…</span><label class="tool checkbox focus-toggle" title="Show only the note, its preview, and the timer"><input type="checkbox" id="focus-mode"> Focus</label><label class="tool checkbox compact-toggle" title="Fold the day headings of earlier weeks, and keep the current week open"><input type="checkbox" id="compact-mode"> Compact</label><span class="views" role="group" aria-label="View"><button class="tool view-option" data-view="edit" aria-label="Editor only">Edit</button><button class="tool view-option" data-view="split" aria-label="Split view">Split</button><button class="tool view-option" data-view="preview" aria-label="Preview only">Preview</button></span><button id="bold" class="tool" title="Bold (⌘B)" aria-label="Bold">B</button><button id="italic" class="tool" title="Italic (⌘I)" aria-label="Italic">I</button><label class="tool checkbox" title="Turn spell check on or off"><input type="checkbox" id="spellcheck" checked> Spell check</label><button id="delete" class="tool">Delete</button><button id="restore" class="tool" hidden>Restore</button><button id="purge" class="tool" hidden>Delete forever</button><button id="save" class="tool">Save <kbd>⌘S</kbd></button></div>
    <section class="editor" id="editor" data-view="split">
      <textarea id="content" aria-label="Note content" placeholder="Start writing…" maxlength="200000" spellcheck="true"></textarea>
      <div id="preview" aria-label="Preview"></div>
    </section>
    <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
  </main>
  <dialog id="image-viewer" aria-label="Image preview"><button id="close-image" type="button" aria-label="Close image preview">Close ×</button><img id="enlarged-image" alt=""><p id="image-caption"></p></dialog>
</body>
</html>
